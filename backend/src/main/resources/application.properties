# ======================================================================
# Sayak Grocery App - Spring Boot Backend Configuration
# Values are loaded from environment variables / .env file
# ======================================================================

server.port=${PORT:8080}
spring.application.name=sayak-backend

# ----------------------------------------------------------------------
# SUPABASE POSTGRESQL (Live Cloud Database)
# Injected via DB_URL, DB_USERNAME, DB_PASSWORD from .env
# ----------------------------------------------------------------------
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration (Auto-creates users & otp_verifications tables in Supabase)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# ----------------------------------------------------------------------
# Real-time OTP Configuration
# ----------------------------------------------------------------------
sayak.otp.expiration-seconds=${OTP_EXPIRATION_SECONDS:300}
sayak.otp.length=${OTP_LENGTH:6}
sayak.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
sayak.otp.dev-mode=${OTP_DEV_MODE:true}

# ----------------------------------------------------------------------
# SMS Gateway Configuration
# ----------------------------------------------------------------------
sayak.sms.provider=${SMS_PROVIDER:MOCK}
sayak.sms.fast2sms.api-key=${FAST2SMS_API_KEY:}
sayak.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sayak.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sayak.sms.twilio.from-phone=${TWILIO_FROM_PHONE:+1234567890}

# ----------------------------------------------------------------------
# Security / JWT Configuration
# ----------------------------------------------------------------------
sayak.jwt.secret=${JWT_SECRET:SayakGrocerySuperSecretKeyForJwtTokenGeneration20261011SecureHMACDefault}
sayak.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.sayak=INFO
logging.level.org.springframework.web=INFO

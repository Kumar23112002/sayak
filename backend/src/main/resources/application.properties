# ======================================================================
# Sayak Grocery App - Spring Boot Backend Configuration
# ======================================================================

server.port=8080
spring.application.name=sayak-backend

# ----------------------------------------------------------------------
# SUPABASE POSTGRESQL (Live Cloud Database)
# ----------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.wsvgiwattiwnvspmtafs
spring.datasource.password=Rishika@sayak1
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration (Auto-creates users & otp_verifications tables in Supabase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# ----------------------------------------------------------------------
# Real-time OTP Configuration
# ----------------------------------------------------------------------
sayak.otp.expiration-seconds=300
sayak.otp.length=6
sayak.otp.max-attempts=5
sayak.otp.dev-mode=true

# ----------------------------------------------------------------------
# SMS Gateway Configuration
# ----------------------------------------------------------------------
sayak.sms.provider=MOCK
sayak.sms.fast2sms.api-key=YOUR_FAST2SMS_API_KEY
sayak.sms.twilio.account-sid=YOUR_TWILIO_SID
sayak.sms.twilio.auth-token=YOUR_TWILIO_AUTH_TOKEN
sayak.sms.twilio.from-phone=+1234567890

# ----------------------------------------------------------------------
# Security / JWT Configuration
# ----------------------------------------------------------------------
sayak.jwt.secret=SayakGrocerySuperSecretKeyForJwtTokenGeneration20261011SecureHMAC
sayak.jwt.expiration-ms=86400000

# Logging
logging.level.com.sayak=DEBUG
logging.level.org.springframework.web=INFO
